plugins {
    id 'com.android.application'
}

android {
    namespace 'com.danz.gametools'
    compileSdk 33

    defaultConfig {
        applicationId "com.danz.gametools"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
